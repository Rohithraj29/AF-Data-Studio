
server:
  port: 8080

spring:
  application:
    name: af-data-studio

  datasource:
    url: jdbc:postgresql://localhost:5432/dataforge_db
    username: postgres
    password: 12345
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false

  servlet:
    multipart:
      enabled: true
      max-file-size: 50MB
      max-request-size: 50MB

logging:
  level:
    com.altiusfortius.datastudio: INFO
